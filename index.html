<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>冒険マップスタンプ</title>
<style>
  body {
    margin: 0;
    background: #f7f7f7;
    text-align: center;
    font-family: sans-serif;
  }
  #mapCanvas {
    width: 100%;
    max-width: 900px;
    touch-action: none;
    display: block;
    margin: 0 auto;
  }
  #controls {
    margin-top: 10px;
  }
  button {
    padding: 10px 20px;
    font-size: 16px;
  }
</style>
</head>

<body>
<h2>冒険マップスタンプ</h2>
<canvas id="mapCanvas"></canvas>

<div id="controls">
  <button onclick="clearAll()">スタンプを消す</button>
</div>

<script>
const canvas = document.getElementById("mapCanvas");
const ctx = canvas.getContext("2d");

// マップ画像
const mapImg = new Image();
mapImg.src = "map.png";

// カボチャ画像
const pumpkinImg = new Image();
pumpkinImg.src = "pumpkin.png";

let stamps = [];

// 保存データ読み込み
function loadData() {
  const saved = localStorage.getItem("riva-map-stamps");
  if (saved) stamps = JSON.parse(saved);
}

// 保存データ書き込み
function saveData() {
  localStorage.setItem("riva-map-stamps", JSON.stringify(stamps));
}

// すべて消す
function clearAll() {
  stamps = [];
  saveData();
  drawAll();
}

// 描画処理
function drawAll() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.drawImage(mapImg, 0, 0, canvas.width, canvas.height);

  const rect = canvas.getBoundingClientRect();
  const scaleX = canvas.width / rect.width;
  const stampSize = 90 * scaleX;

  stamps.forEach(s => {

    // 影
    ctx.shadowColor = "rgba(0,0,0,0.4)";
    ctx.shadowBlur = 12;

    ctx.drawImage(pumpkinImg, s.x - stampSize/2, s.y - stampSize/2, stampSize, stampSize);

    ctx.shadowBlur = 0;

    // 白縁
    ctx.strokeStyle = "white";
    ctx.lineWidth = 6;
    ctx.beginPath();
    ctx.arc(s.x, s.y, stampSize / 2, 0, Math.PI * 2);
    ctx.stroke();
  });
}

// タップ位置取得（ズレ補正＋トグル機能）
canvas.addEventListener("pointerdown", (e) => {
  const rect = canvas.getBoundingClientRect();
  const scaleX = canvas.width / rect.width;
  const scaleY = canvas.height / rect.height;

  const x = (e.clientX - rect.left) * scaleX;
  const y = (e.clientY - rect.top) * scaleY;

  // ★ トグル処理：近くに既存スタンプがあるかチェック
  const threshold = 50 * scaleX; // 判定距離
  const index = stamps.findIndex(s => {
    const dx = s.x - x;
    const dy = s.y - y;
    return Math.sqrt(dx*dx + dy*dy) < threshold;
  });

  if (index >= 0) {
    // ★ 既存スタンプが近くにある → 消す
    stamps.splice(index, 1);
  } else {
    // ★ ない → 新しく追加
    stamps.push({ x, y });
  }

  saveData();
  drawAll();
});

// 画像読み込み後にキャンバスサイズ設定
mapImg.onload = () => {
  const displayWidth = canvas.getBoundingClientRect().width;
  const scale = displayWidth / mapImg.width;

  canvas.width = mapImg.width * scale;
  canvas.height = mapImg.height * scale;

  loadData();
  drawAll();
};
</script>

</body>
</html>
