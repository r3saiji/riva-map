<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>冒険マップスタンプ</title>

<style>
* {
  box-sizing: border-box;
}

html, body {
  width: 100%;
  height: 100%;
  margin: 0;
  padding: 0;
  overflow: hidden;
  font-family: sans-serif;
  background: #f7f7f7;
  text-align: center;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 4px;
  gap: 3px;
}

/* タイトル */
.titleBox {
  flex: 0 0 auto;
  width: 100%;
  padding: 3px;
  border: 2px solid #ff6600;
  border-radius: 10px;
  background: white;
  line-height: 1.1;
}

.big-kira {
  font-size: clamp(17px, 5vw, 28px);
  font-weight: bold;
  color: white;
  -webkit-text-stroke: 1px #ff6600;
  text-shadow:
    0 0 5px rgba(255,150,0,0.9),
    0 0 10px rgba(255,120,0,0.7),
    2px 2px 3px rgba(0,0,0,0.3);
  animation: kira 2.5s infinite ease-in-out;
}

@keyframes kira {
  0%, 100% {
    text-shadow: 0 0 5px rgba(255,150,0,0.6);
  }
  50% {
    text-shadow: 0 0 12px rgba(255,180,0,1);
  }
}

/* サブタイトル */
.titleSub {
  flex: 0 0 auto;
  font-size: clamp(12px, 3.2vw, 17px);
  line-height: 1.2;
}

/* 説明文 */
.infoBox {
  flex: 0 0 auto;
  width: 100%;
  padding: 4px;
  border: 2px solid #8888ff;
  border-radius: 8px;
  background: white;
  font-size: clamp(10px, 2.7vw, 14px);
  line-height: 1.25;
}

/* マップ */
#mapCanvas {
  display: block;
  width: 100%;
  flex: 1 1 auto;
  min-height: 0;
  object-fit: contain;
  touch-action: none;
}

/* スタンプ消去 */
#controls {
  flex: 0 0 auto;
  width: 100%;
}

#controls button {
  width: 100%;
  height: clamp(30px, 5vh, 42px);
  padding: 2px;
  font-size: clamp(14px, 3.5vw, 19px);
  font-weight: bold;
  color: white;
  background: #ff6666;
  border: 2px solid #e54444;
  border-radius: 8px;
}

/* お店紹介 */
#shopIntro {
  flex: 0 0 auto;
  font-size: clamp(10px, 2.8vw, 14px);
  font-weight: bold;
  line-height: 1.15;
  color: #444;
}

/* お店ボタン：4列 */
#shopList {
  flex: 0 0 auto;
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 3px;
  width: 100%;
}

.shopButton {
  min-width: 0;
  height: clamp(30px, 5.5vh, 45px);
  padding: 2px;
  background: #ffcc66;
  border: 1px solid #e9a735;
  border-radius: 6px;
  font-size: clamp(9px, 2.5vw, 13px);
  font-weight: bold;
  line-height: 1.1;
  overflow-wrap: anywhere;
}

/* 高さが小さいスマホ */
@media (max-height: 700px) {
  body {
    gap: 2px;
    padding: 2px;
  }

  .titleBox {
    padding: 2px;
  }

  .titleSub {
    font-size: 11px;
  }

  .infoBox {
    padding: 2px;
    font-size: 10px;
  }

  #shopIntro {
    font-size: 10px;
  }

  .shopButton {
    height: 29px;
    font-size: 9px;
  }

  #controls button {
    height: 29px;
    font-size: 13px;
  }
}
</style>
</head>

<body>

<div class="titleBox">
  <span class="big-kira">あきまつり★リバ３</span><br>
  <span class="big-kira">🎃 HALLOWEEN 🎃</span>
</div>

<div class="titleSub">
  おまつりマップに おばけスタンプを おしちゃおう！
</div>

<div class="infoBox">
  いったところにタップするとおばけがでてくるよ。<br>
  もういちどタップするときえるよ
</div>

<canvas id="mapCanvas"></canvas>

<div id="controls">
  <button onclick="clearAll()">スタンプを全部消す</button>
</div>

<div id="shopIntro">
  ★おみせのしょうかい★ ボタンをタップしてごらん！
</div>

<div id="shopList">
  <button class="shopButton" onclick="showShopInfo('フランク')">フランク</button>
  <button class="shopButton" onclick="showShopInfo('焼きいか・焼きうどん')">焼きいか・焼きうどん</button>
  <button class="shopButton" onclick="showShopInfo('キッチンカー')">キッチンカー</button>
  <button class="shopButton" onclick="showShopInfo('こどもお楽しみエリア')">こどもお楽しみエリア</button>
  <button class="shopButton" onclick="showShopInfo('こども受付')">こども受付</button>
  <button class="shopButton" onclick="showShopInfo('ゲームコーナー')">ゲームコーナー</button>
  <button class="shopButton" onclick="showShopInfo('お菓子渡し')">お菓子渡し</button>
  <button class="shopButton" onclick="showShopInfo('たべもの券')">たべもの券</button>
  <button class="shopButton" onclick="showShopInfo('大抽選会受付')">大抽選会受付</button>
  <button class="shopButton" onclick="showShopInfo('ドリンク販売')">ドリンク販売</button>
  <button class="shopButton" onclick="showShopInfo('メインステージ')">メインステージ</button>
  <button class="shopButton" onclick="showShopInfo('公民館飲食・休憩エリア')">公民館飲食・休憩エリア</button>
  <button class="shopButton" onclick="showShopInfo('模擬店1')">模擬店1</button>
  <button class="shopButton" onclick="showShopInfo('模擬店2')">模擬店2</button>
</div>

<script>
const canvas = document.getElementById("mapCanvas");
const ctx = canvas.getContext("2d");

const mapImg = new Image();
mapImg.src = "map.png";

const obakeImg = new Image();
obakeImg.src = "pumpkin.png";

let stamps = [];

const shopInfo = {
  "フランク": "ジューシーなソーセージが人気！\nおたのしみ券とひきかえだよ",
  "焼きいか・焼きうどん": "香ばしい匂いが漂う屋台。\n200円で、はんばいしているよ",
  "キッチンカー": "7台のキッチンカーが来てるよ！\nおしゃれなフードトラックでおいしいものたべよう！\n券をお店の人にわたせば、100円やすいよ！",
  "こどもお楽しみエリア": "子どもたちの楽しいコーナーだよ！",
  "こども受付": "こども抽選会の受付や\nおたのしみ券の受付してね！",
  "ゲームコーナー": "子どもたちに大人気のゲームコーナだよ！！",
  "お菓子渡し": "子どもたちにお菓子をプレゼント！\nおたのしみ券を見せてね！",
  "たべもの券": "たべもの券とたべものをひきかえするところ",
  "大抽選会受付": "抽選会の受付はこちら！\n抽選会の受付締め切りは12時までだよ！",
  "ドリンク販売": "アルコールやジュースなどたべものを販売しているよ。\nビール　150円\nチューハイ　100円\nソフトドリンク　50円\n13：00～本数無制限\n★スピンオフ★\n（数に限りがあります。）\nミニたいやき　20円\n焼きプリンタルト　30円\nビーフカレー中辛　60円",
  "メインステージ": "10：00～シニアバンドの演奏やおどり\n11：30～コスプレショー\n12：00～こども抽選会\n13：00～大抽選会\nが開催されるよ！",
  "公民館飲食・休憩エリア": "ゆっくり休めるスペースだよ。\nたべたり、のんだりできるところだよ",
  "模擬店1": "[ おひさま ] の、おみせだよ",
  "模擬店2": "[ ひとふさのぶどう ] の、おみせだよ"
};

function showShopInfo(name) {
  alert(`${name}\n${shopInfo[name]}`);
}

function loadData() {
  const saved = localStorage.getItem("riva-map-stamps");
  if (saved) {
    try {
      stamps = JSON.parse(saved);
    } catch {
      stamps = [];
    }
  }
}

function saveData() {
  localStorage.setItem("riva-map-stamps", JSON.stringify(stamps));
}

function clearAll() {
  stamps = [];
  saveData();
  drawAll();
}

function resizeCanvas() {
  if (!mapImg.complete || !mapImg.naturalWidth) return;

  const rect = canvas.getBoundingClientRect();

  // マップ画像の縦横比を維持
  const scale = Math.min(
    rect.width / mapImg.naturalWidth,
    rect.height / mapImg.naturalHeight
  );

  const oldWidth = canvas.width;
  const oldHeight = canvas.height;

  const newWidth = Math.round(mapImg.naturalWidth * scale);
  const newHeight = Math.round(mapImg.naturalHeight * scale);

  if (oldWidth && oldHeight && stamps.length) {
    stamps = stamps.map(s => ({
      x: s.x * newWidth / oldWidth,
      y: s.y * newHeight / oldHeight
    }));
  }

  canvas.width = newWidth;
  canvas.height = newHeight;

  drawAll();
}

function drawAll() {
  if (!mapImg.complete || !mapImg.naturalWidth) return;

  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.drawImage(mapImg, 0, 0, canvas.width, canvas.height);

  const stampSize = canvas.width * 0.08;

  stamps.forEach(s => {
    if (obakeImg.complete && obakeImg.naturalWidth) {
      ctx.shadowColor = "rgba(0,0,0,0.4)";
      ctx.shadowBlur = 8;
      ctx.drawImage(
        obakeImg,
        s.x - stampSize / 2,
        s.y - stampSize / 2,
        stampSize,
        stampSize
      );
      ctx.shadowBlur = 0;
    }

    ctx.strokeStyle = "white";
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(s.x, s.y, stampSize / 2, 0, Math.PI * 2);
    ctx.stroke();
  });
}

canvas.addEventListener("pointerdown", (e) => {
  const rect = canvas.getBoundingClientRect();

  const x = (e.clientX - rect.left) * canvas.width / rect.width;
  const y = (e.clientY - rect.top) * canvas.height / rect.height;

  const threshold = canvas.width * 0.06;

  const index = stamps.findIndex(s => {
    const dx = s.x - x;
    const dy = s.y - y;
    return Math.sqrt(dx * dx + dy * dy) < threshold;
  });

  if (index >= 0) {
    stamps.splice(index, 1);
  } else {
    stamps.push({ x, y });
  }

  saveData();
  drawAll();
});

mapImg.onload = () => {
  loadData();
  resizeCanvas();
};

obakeImg.onload = drawAll;

window.addEventListener("resize", resizeCanvas);
</script>

</body>
</html>
