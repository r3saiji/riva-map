<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>冒険マップスタンプ</title>
　
<style>
  body {
    margin: 0;
    background: #f7f7f7;
    text-align: center;
    font-family: sans-serif;
  }

  /* ★ キラキラタイトル */
  .big-kira {
    font-size: 60px;
    font-weight: bold;
    color: #fff;
    -webkit-text-stroke: 4px #ff6600;
    text-shadow:
      0 0 10px rgba(255,150,0,0.9),
      0 0 20px rgba(255,120,0,0.7),
      0 0 30px rgba(255,80,0,0.6),
      4px 4px 8px rgba(0,0,0,0.4);
    display: inline-block;
    margin: 6px 0;
    animation: kira 2.5s infinite ease-in-out;
  }

  @keyframes kira {
    0% {
      text-shadow:
        0 0 8px rgba(255,150,0,0.6),
        0 0 16px rgba(255,120,0,0.5),
        0 0 24px rgba(255,80,0,0.4),
        4px 4px 8px rgba(0,0,0,0.4);
    }
    50% {
      text-shadow:
        0 0 18px rgba(255,200,0,1),
        0 0 30px rgba(255,160,0,0.9),
        0 0 40px rgba(255,120,0,0.8),
        4px 4px 12px rgba(0,0,0,0.5);
    }
    100% {
      text-shadow:
        0 0 8px rgba(255,150,0,0.6),
        0 0 16px rgba(255,120,0,0.5),
        0 0 24px rgba(255,80,0,0.4),
        4px 4px 8px rgba(0,0,0,0.4);
    }
  }

  #mapCanvas {
    width: 100%;
    max-width: 900px;
    touch-action: none;
    display: block;
    margin: 0 auto;
  }

  #info {
    font-size: 18px;
    margin: 10px 0;
    color: #333;
  }

  #shopList {
    margin-top: 15px;
  }

  .shopButton {
    display: inline-block;
    margin: 5px;
    padding: 10px 15px;
    background-color: #ffcc66;
    border: none;
    border-radius: 8px;
    font-size: 16px;
    cursor: pointer;
  }

  .shopButton:hover {
    background-color: #ffdd88;
  }

  #controls button {
    margin-top: 10px;
    padding: 10px 20px;
    font-size: 18px;
    background-color: #ff8888;
    border: none;
    border-radius: 10px;
    cursor: pointer;
  }

  #controls button:hover {
    background-color: #ffaaaa;
  }
</style>
</head>

<body>

<!-- ★ キラキラタイトル（ページの一番上） -->
<h2>
  <span class="big-kira">秋祭り★リバ3自治会</span><br>
 
  <span class="big-kira">🎃　HALLOWEEN　🎃</span><br>
  おまつりマップに<br>
  おばけスタンプをおしちゃおう！
</h2>

<div id="info">
  行ったところにタップするとおばけが出てくるよ。もう一度タップすると消えるよ。<br>
  下のお店の名前をタップすると説明が出るよ。
</div>

<canvas id="mapCanvas"></canvas>

<!-- ★ マップのすぐ下に移動したボタン -->
<div id="controls">
  <button onclick="clearAll()">スタンプを全部消す</button>
</div>

<!-- ★ 13店舗のボタン一覧 -->
<div id="shopList">
  <button class="shopButton" onclick="showShopInfo('フランク')">フランク</button>
  <button class="shopButton" onclick="showShopInfo('焼きいか')">焼きいか</button>
  <button class="shopButton" onclick="showShopInfo('キッチンカー')">キッチンカー</button>

  <button class="shopButton" onclick="showShopInfo('こどもお楽しみエリア')">こどもお楽しみエリア</button>
  <button class="shopButton" onclick="showShopInfo('ゲームコーナー')">ゲームコーナー</button>
  <button class="shopButton" onclick="showShopInfo('お菓子渡し')">お菓子渡し</button>

  <button class="shopButton" onclick="showShopInfo('たべもの券')">たべもの券</button>
  <button class="shopButton" onclick="showShopInfo('大抽選会受付')">大抽選会受付</button>
  <button class="shopButton" onclick="showShopInfo('ドリンク販売')">ドリンク販売</button>

  <button class="shopButton" onclick="showShopInfo('メインステージ')">メインステージ</button>
  <button class="shopButton" onclick="showShopInfo('公民館飲食・休憩エリア')">公民館飲食・休憩エリア</button>

  <button class="shopButton" onclick="showShopInfo('模擬店1')">模擬店1</button>
  <button class="shopButton" onclick="showShopInfo('模擬店2')">模擬店2</button>
</div>

<script>
const canvas = document.getElementById("mapCanvas");
const ctx = canvas.getContext("2d");
const mapImg = new Image();
mapImg.src = "map.png";
const obakeImg = new Image();
obakeImg.src = "obake.png";

let stamps = [];

// ★ 13店舗の説明文
const shopInfo = {
  "フランク": "ジューシーなソーセージが人気！",
  "焼きいか": "香ばしい匂いが漂う屋台。",
  "キッチンカー": "おしゃれなフードトラックで軽食をどうぞ。",
  "こどもお楽しみエリア": "小さな子ども向けの楽しいコーナーだよ！",
  "ゲームコーナー": "射的や輪投げなど、子どもたちに大人気！",
  "お菓子渡し": "子どもたちにお菓子をプレゼント！",
  "たべもの券": "食べ物を買うための券を販売しているよ。",
  "大抽選会受付": "抽選会の受付はこちら！",
  "ドリンク販売": "ジュースや飲み物を販売しているよ。",
  "メインステージ": "イベントやショーが開催されるよ！",
  "公民館飲食・休憩エリア": "ゆっくり休めるスペースだよ。",
  "模擬店1": "[ おひさま ] の、おみせだよ",
  "模擬店2": "[ ひとふさのぶどう ] の、おみせだよ"
};

// ★ ポップアップ表示
function showShopInfo(name) {
  alert(`${name}\n${shopInfo[name]}`);
}

// 保存データ読み込み
function loadData() {
  const saved = localStorage.getItem("riva-map-stamps");
  if (saved) stamps = JSON.parse(saved);
}

// 保存データ書き込み
function saveData() {
  localStorage.setItem("riva-map-stamps", JSON.stringify(stamps));
}

// すべて消す
function clearAll() {
  stamps = [];
  saveData();
  drawAll();
}

// 描画処理
function drawAll() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.drawImage(mapImg, 0, 0, canvas.width, canvas.height);

  const rect = canvas.getBoundingClientRect();
  const scaleX = canvas.width / rect.width;
  const stampSize = 70 * scaleX;

  stamps.forEach(s => {
    ctx.shadowColor = "rgba(0,0,0,0.4)";
    ctx.shadowBlur = 12;
    ctx.drawImage(obakeImg, s.x - stampSize/2, s.y - stampSize/2, stampSize, stampSize);
    ctx.shadowBlur = 0;

    ctx.strokeStyle = "white";
    ctx.lineWidth = 6;
    ctx.beginPath();
    ctx.arc(s.x, s.y, stampSize / 2, 0, Math.PI * 2);
    ctx.stroke();
  });
}

// タップ位置取得（ズレ補正＋トグル機能）
canvas.addEventListener("pointerdown", (e) => {
  const rect = canvas.getBoundingClientRect();
  const scaleX = canvas.width / rect.width;
  const scaleY = canvas.height / rect.height;
  const x = (e.clientX - rect.left) * scaleX;
  const y = (e.clientY - rect.top) * scaleY;

  const threshold = 50 * scaleX;
  const index = stamps.findIndex(s => {
    const dx = s.x - x;
    const dy = s.y - y;
    return Math.sqrt(dx*dx + dy*dy) < threshold;
  });

  if (index >= 0) {
    stamps.splice(index, 1);
  } else {
    stamps.push({ x, y });
  }

  saveData();
  drawAll();
});

// 画像読み込み後にキャンバスサイズ設定
mapImg.onload = () => {
  const displayWidth = canvas.getBoundingClientRect().width;
  const scale = displayWidth / mapImg.width;
  canvas.width = mapImg.width * scale;
  canvas.height = mapImg.height * scale;
  loadData();
  drawAll();
};
</script>

</body>
</html>
