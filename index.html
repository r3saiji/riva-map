<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>あきまつり リバ３ ハロウィン</title>

<style>
* {
  box-sizing: border-box;
}

html,
body {
  width: 100%;
  height: 100%;
  margin: 0;
  padding: 0;
  overflow: hidden;
  font-family: "Noto Sans JP", "Meiryo", sans-serif;
  background: #fff8e8;
  color: #38220e;
}

body {
  display: flex;
  flex-direction: column;
  align-items: stretch;
  padding:
    max(3px, env(safe-area-inset-top))
    7px
    max(3px, env(safe-area-inset-bottom));
  gap: 3px;
}

/* タイトル */
header {
  flex: 0 0 auto;
  text-align: center;
  line-height: 1.1;
}

h1 {
  margin: 0;
  font-size: clamp(17px, 4.5vw, 27px);
  font-weight: 900;
  color: #b73517;
  text-shadow:
    1px 1px 0 #fff,
    2px 2px 0 #ffd45a;
  letter-spacing: 0.02em;
}

.subtitle {
  margin-top: 3px;
  font-size: clamp(11px, 2.8vw, 15px);
  font-weight: 800;
  color: #583719;
}

/* 説明 */
.information {
  flex: 0 0 auto;
  text-align: center;
  padding: 4px 5px;
  border: 2px solid #f0a32a;
  border-radius: 9px;
  background: #fff0b8;
  line-height: 1.25;
}

.information .main {
  font-size: clamp(12px, 3vw, 16px);
  font-weight: 900;
  color: #a92e13;
}

.information .sub {
  margin-top: 2px;
  font-size: clamp(10px, 2.5vw, 13px);
  font-weight: 700;
}

/* マップ */
.map-area {
  flex: 1 1 0;
  min-height: 0;
  width: 100%;
  display: flex;
  align-items: stretch;
  justify-content: center;
  overflow: hidden;
}

#mapCanvas {
  display: block;
  width: 100%;
  height: 100%;
  min-width: 0;
  min-height: 0;
  touch-action: manipulation;
}

/* 全消去ボタン */
.clear-area {
  flex: 0 0 auto;
  display: flex;
  justify-content: center;
}

#clearButton {
  width: min(100%, 340px);
  min-height: 32px;
  border: 2px solid #8b250f;
  border-radius: 9px;
  background: #c83a1d;
  color: white;
  font-size: clamp(12px, 3vw, 15px);
  font-weight: 900;
  padding: 5px 8px;
  box-shadow: 0 2px 0 #84230f;
}

/* 店舗ボタン：3列 */
.shop-area {
  flex: 0 0 auto;
  width: 100%;
}

.shop-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 4px;
}

.shop-button {
  min-width: 0;
  min-height: 34px;
  padding: 4px 3px;
  border: 2px solid #d47b20;
  border-radius: 8px;
  background: #fff;
  color: #54290d;
  font-size: clamp(10px, 2.8vw, 14px);
  line-height: 1.15;
  font-weight: 800;
  overflow-wrap: anywhere;
  box-shadow: 0 2px 0 #e8b66a;
  touch-action: manipulation;
}

.shop-button:active,
#clearButton:active {
  transform: translateY(1px);
  box-shadow: none;
}

@media (max-height: 700px) {
  body {
    gap: 2px;
    padding-left: 5px;
    padding-right: 5px;
  }

  .information {
    padding: 3px;
  }

  .shop-grid {
    gap: 3px;
  }

  .shop-button {
    min-height: 29px;
    padding: 3px 2px;
  }

  #clearButton {
    min-height: 28px;
    padding: 3px 6px;
  }
}
</style>
</head>

<body>

<header>
  <h1>🎃 あきまつり リバ３ ハロウィン 🎃</h1>
  <div class="subtitle">冒険マップ スタンプラリー</div>
</header>

<section class="information">
  <div class="main">スマホでスタンプをおしてあそぼう！</div>
  <div class="sub">おみせの せつめいも あるよ</div>
</section>

<div class="map-area">
  <canvas id="mapCanvas"></canvas>
</div>

<div class="clear-area">
  <button id="clearButton" type="button">🧹 スタンプを全部消す</button>
</div>

<section class="shop-area">
  <div class="shop-grid" id="shopGrid"></div>
</section>

<script>
"use strict";

/* 画像 */
const mapImg = new Image();
mapImg.src = "map.png";

const stampImg = new Image();
stampImg.src = "pumpkin.png";

/* Canvas */
const canvas = document.getElementById("mapCanvas");
const ctx = canvas.getContext("2d");

const STORAGE_KEY = "riva-map-stamps";

let stamps = [];
let mapLayout = null;

/* 店舗情報 */
const shopInfo = {
  "フランク": "フランクフルトのお店です。お祭りの食べ歩きを楽しんでね！",

  "焼きいか・焼きうどん": "焼きいか・焼きうどんのお店です。おいしいメニューを楽しんでね！",

  "キッチンカー": "キッチンカーのお店です。どんなメニューがあるか見てみよう！",

  "こどもお楽しみエリア": "こども向けのお楽しみエリアです。楽しい時間を過ごしてね！",

  "こども受付": "こども向けイベントの受付です。参加する人はこちらへどうぞ！",

  "ゲームコーナー": "ゲームに挑戦できるコーナーです。いろいろなゲームで遊んでね！",

  "お菓子渡し": "お菓子を受け取る場所です。案内にしたがって並んでね！",

  "たべもの券": "たべもの券の受付です。必要な券をこちらで確認してね！",

  "大抽選会受付": "大抽選会の受付です。参加方法を確認してね！",

  "ドリンク販売": "飲み物を販売しています。水分補給も忘れずに！",

  "メインステージ": "イベントのメインステージです。ステージイベントを楽しんでね！",

  "公民館飲食・休憩エリア": "飲食や休憩に利用できるエリアです。ゆっくり休んでね！",

  "模擬店１": "模擬店のお店です。どんなお店があるか見てみよう！",

  "模擬店２": "模擬店のお店です。お祭りのお買い物を楽しんでね！"
};

const shopNames = [
  "フランク",
  "焼きいか・焼きうどん",
  "キッチンカー",
  "こどもお楽しみエリア",
  "こども受付",
  "ゲームコーナー",
  "お菓子渡し",
  "たべもの券",
  "大抽選会受付",
  "ドリンク販売",
  "メインステージ",
  "公民館飲食・休憩エリア",
  "模擬店１",
  "模擬店２"
];

/* 店舗ボタン作成 */
const shopGrid = document.getElementById("shopGrid");

shopNames.forEach((name) => {
  const button = document.createElement("button");

  button.type = "button";
  button.className = "shop-button";
  button.textContent = name;

  button.addEventListener("click", () => {
    showShopInfo(name);
  });

  shopGrid.appendChild(button);
});

function showShopInfo(name) {
  const description = shopInfo[name] || "お店の説明はありません。";
  alert(`${name}\n\n${description}`);
}

/* スタンプ読み込み */
function loadStamps() {
  try {
    const saved = localStorage.getItem(STORAGE_KEY);

    if (!saved) {
      stamps = [];
      return;
    }

    const parsed = JSON.parse(saved);

    if (!Array.isArray(parsed)) {
      stamps = [];
      return;
    }

    const imageWidth = mapImg.naturalWidth;
    const imageHeight = mapImg.naturalHeight;

    stamps = parsed.filter((stamp) => {
      return Number.isFinite(stamp.x) &&
             Number.isFinite(stamp.y) &&
             stamp.x >= 0 &&
             stamp.y >= 0 &&
             stamp.x <= imageWidth &&
             stamp.y <= imageHeight;
    });

  } catch (error) {
    stamps = [];
  }
}

function saveStamps() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(stamps));
}

/* Canvasサイズ調整 */
function resizeCanvas() {
  const rect = canvas.getBoundingClientRect();

  if (rect.width <= 0 || rect.height <= 0) {
    return;
  }

  const dpr = window.devicePixelRatio || 1;

  canvas.width = Math.round(rect.width * dpr);
  canvas.height = Math.round(rect.height * dpr);

  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  drawAll();
}

/* マップの表示位置・倍率 */
function calculateMapLayout() {
  if (!mapImg.complete ||
      mapImg.naturalWidth === 0 ||
      mapImg.naturalHeight === 0) {
    mapLayout = null;
    return null;
  }

  const rect = canvas.getBoundingClientRect();

  const viewWidth = rect.width;
  const viewHeight = rect.height;

  const imageWidth = mapImg.naturalWidth;
  const imageHeight = mapImg.naturalHeight;

  const scale = Math.min(
    viewWidth / imageWidth,
    viewHeight / imageHeight
  );

  const drawWidth = imageWidth * scale;
  const drawHeight = imageHeight * scale;

  const offsetX = (viewWidth - drawWidth) / 2;
  const offsetY = (viewHeight - drawHeight) / 2;

  mapLayout = {
    viewWidth,
    viewHeight,
    imageWidth,
    imageHeight,
    scale,
    offsetX,
    offsetY,
    drawWidth,
    drawHeight
  };

  return mapLayout;
}

/* マップとスタンプを描画 */
function drawAll() {
  const rect = canvas.getBoundingClientRect();

  ctx.clearRect(0, 0, rect.width, rect.height);

  const layout = calculateMapLayout();

  if (!layout) {
    return;
  }

  const {
    scale,
    offsetX,
    offsetY,
    drawWidth,
    drawHeight
  } = layout;

  ctx.drawImage(
    mapImg,
    offsetX,
    offsetY,
    drawWidth,
    drawHeight
  );

  stamps.forEach((stamp) => {
    const stampX = offsetX + stamp.x * scale;
    const stampY = offsetY + stamp.y * scale;

    const stampSize = Math.max(18, 42 * scale);

    if (stampImg.complete && stampImg.naturalWidth > 0) {
      ctx.drawImage(
        stampImg,
        stampX - stampSize / 2,
        stampY - stampSize / 2,
        stampSize,
        stampSize
      );
    } else {
      ctx.beginPath();
      ctx.arc(stampX, stampY, 12, 0, Math.PI * 2);
      ctx.fillStyle = "#ff7a00";
      ctx.fill();
      ctx.strokeStyle = "#ffffff";
      ctx.lineWidth = 2;
      ctx.stroke();
    }
  });
}

/* タップ位置を画像座標に変換 */
canvas.addEventListener("pointerdown", (event) => {
  if (!mapImg.complete ||
      mapImg.naturalWidth === 0 ||
      mapImg.naturalHeight === 0) {
    return;
  }

  const layout = calculateMapLayout();

  if (!layout) {
    return;
  }

  const rect = canvas.getBoundingClientRect();

  const canvasX = event.clientX - rect.left;
  const canvasY = event.clientY - rect.top;

  const imageX =
    (canvasX - layout.offsetX) / layout.scale;

  const imageY =
    (canvasY - layout.offsetY) / layout.scale;

  if (
    imageX < 0 ||
    imageY < 0 ||
    imageX > layout.imageWidth ||
    imageY > layout.imageHeight
  ) {
    return;
  }

  const removeDistance = 35 / layout.scale;

  const existingIndex = stamps.findIndex((stamp) => {
    const dx = stamp.x - imageX;
    const dy = stamp.y - imageY;

    return Math.sqrt(dx * dx + dy * dy) < removeDistance;
  });

  if (existingIndex >= 0) {
    stamps.splice(existingIndex, 1);
  } else {
    stamps.push({
      x: imageX,
      y: imageY
    });
  }

  saveStamps();
  drawAll();
});

/* 全スタンプ消去 */
function clearAll() {
  if (stamps.length === 0) {
    return;
  }

  if (!confirm("スタンプを全部消しますか？")) {
    return;
  }

  stamps = [];
  saveStamps();
  drawAll();
}

document
  .getElementById("clearButton")
  .addEventListener("click", clearAll);

/* 初期化 */
mapImg.addEventListener("load", () => {
  loadStamps();
  resizeCanvas();
});

mapImg.addEventListener("error", () => {
  alert("map.png を読み込めませんでした。\nHTMLと同じフォルダーに置いてください。");
});

stampImg.addEventListener("load", () => {
  drawAll();
});

stampImg.addEventListener("error", () => {
  console.warn("pumpkin.png を読み込めませんでした。");
});

window.addEventListener("resize", resizeCanvas);

if (mapImg.complete && mapImg.naturalWidth > 0) {
  loadStamps();
  resizeCanvas();
}
</script>

</body>
</html>
