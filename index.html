<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>冒険マップスタンプ</title>
<style>
  body {
    margin: 0;
    background: #f7f7f7;
    text-align: center;
    font-family: sans-serif;
  }
  #mapCanvas {
    width: 100%;
    max-width: 900px; /* スマホで見やすいサイズ */
    touch-action: none;
  }
  #controls {
    margin-top: 10px;
  }
  button {
    padding: 10px 20px;
    font-size: 16px;
  }
</style>
</head>

<body>
<h2>冒険マップスタンプ</h2>
<canvas id="mapCanvas"></canvas>

<div id="controls">
  <button onclick="clearAll()">全部消す</button>
</div>

<script>
const canvas = document.getElementById("mapCanvas");
const ctx = canvas.getContext("2d");

const mapImg = new Image();
mapImg.src = "map.png";

let stamps = [];

// 保存データ読み込み
function loadData() {
  const saved = localStorage.getItem("riva-map-stamps");
  if (saved) stamps = JSON.parse(saved);
}

// 保存データ書き込み
function saveData() {
  localStorage.setItem("riva-map-stamps", JSON.stringify(stamps));
}

// すべて消す
function clearAll() {
  stamps = [];
  saveData();
  drawAll();
}

// 描画処理
function drawAll() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.drawImage(mapImg, 0, 0, canvas.width, canvas.height);

  // キャンバス縮尺に合わせてスタンプサイズ補正
  const rect = canvas.getBoundingClientRect();
  const scaleX = canvas.width / rect.width;
  const stampSize = 40 * scaleX;  // ← スマホでも見やすいサイズ

  stamps.forEach(s => {
    ctx.fillStyle = "orange";
    ctx.beginPath();
    ctx.arc(s.x, s.y, stampSize / 2, 0, Math.PI * 2);
    ctx.fill();
  });
}

// タップ位置取得（ズレ補正）
canvas.addEventListener("pointerdown", (e) => {
  const rect = canvas.getBoundingClientRect();

  const scaleX = canvas.width / rect.width;
  const scaleY = canvas.height / rect.height;

  const x = (e.clientX - rect.left) * scaleX;
  const y = (e.clientY - rect.top) * scaleY;

  stamps.push({ x, y });
  saveData();
  drawAll();
});

// 画像読み込み後にキャンバスサイズ設定
mapImg.onload = () => {
  canvas.width = mapImg.width;
  canvas.height = mapImg.height;
  loadData();
  drawAll();
};
</script>

</body>
</html>
